# Predictability contrast, position hidden from the model.
#
# Varies world.predictability_contrast for the ephemeris (ground-region), plane
# and random_churn strategies, with model.use_position = false. The companion
# file contrast_position_visible_sweep.yaml is the same sweep with the position
# visible. Both are plotted together by scripts/plot_contrast_pair.py.
#
# predictability_contrast and use_position only affect the world and the model,
# so the 180-satellite trace is reused as is.
#
# 4 contrast levels x 3 strategies x 5 seeds = 60 tasks, one seed per task.
#
# Usage (SLURM, CPU only):
#   python scripts/slurm_submit.py configs/sweeps/contrast_position_hidden_sweep.yaml \
#       --trace data/traces/leo180 --out results/ \
#       --account <group> --qos <group> \
#       --conda-env-path /path/to/conda/envs/orbitfl \
#       --partition <partition> --cpus 2 --mem 6G --time 06:00:00 | sbatch

experiment:
  name: contrast_position_hidden
  delta_steps: 4

model:
  use_position: false

fl:
  round_budget: 300
  round_duration_s: 300
  local_epochs: 1
  participation_rate: 1.0
  eval_interval: 10
  sync_interval: 20
  strategy:
    params:
      use_meo_proximity: false   # ephemeris clusters by ground region

sweep:
  world.predictability_contrast: [0.0, 0.3, 0.6, 0.9]
  fl.strategy.name:
    - ephemeris
    - plane
    - random_churn
  experiment.seeds: [[0], [1], [2], [3], [4]]
